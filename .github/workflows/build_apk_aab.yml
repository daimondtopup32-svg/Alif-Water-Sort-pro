name: Build APK and AAB (Separately Downloadable)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew || true

    - name: Create Release Keystore
      run: |
        keytool -genkeypair -v \
          -keystore my-upload-key.jks \
          -alias upload \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass upload1234 \
          -keypass upload1234 \
          -dname "CN=Alif Water Sort, OU=Games, O=Alif, L=Dhaka, ST=Dhaka, C=BD"

    - name: Build Release APK
      run: |
        STORE_PASSWORD=upload1234 KEY_PASSWORD=upload1234 ./gradlew assembleRelease || STORE_PASSWORD=upload1234 KEY_PASSWORD=upload1234 gradle assembleRelease
        mkdir -p release_outputs/apk
        find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release_outputs/apk/Alif_Water_Sort_Pro.apk \;

    - name: Build Release AAB (Google Play Bundle)
      run: |
        STORE_PASSWORD=upload1234 KEY_PASSWORD=upload1234 ./gradlew bundleRelease || STORE_PASSWORD=upload1234 KEY_PASSWORD=upload1234 gradle bundleRelease
        mkdir -p release_outputs/aab
        find app/build/outputs/bundle/release/ -name "*.aab" -exec cp {} release_outputs/aab/Alif_Water_Sort_Pro.aab \;

    - name: Upload APK as Artifact (Separate Download)
      uses: actions/upload-artifact@v4
      with:
        name: Alif-Water-Sort-Pro-APK
        path: release_outputs/apk/Alif_Water_Sort_Pro.apk
        if-no-files-found: warn

    - name: Upload AAB as Artifact (Separate Download for Play Store)
      uses: actions/upload-artifact@v4
      with:
        name: Alif-Water-Sort-Pro-AAB
        path: release_outputs/aab/Alif_Water_Sort_Pro.aab
        if-no-files-found: warn
