name: Build APK and AAB for Google Play and Amazon

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build:
    name: Build Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Required for Gradle 9 and Android compileSdk 36)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Environment File
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Restore or Generate debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating new debug.keystore for build..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -la debug.keystore

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (For Amazon Appstore & Direct Android Installation)
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build Android App Bundle AAB (For Google Play Store Console)
        run: ./gradlew :app:bundleDebug --stacktrace --no-daemon

      - name: Organize Outputs
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release_artifacts/Alif_Water_Sort_Pro.apk
          cp app/build/outputs/bundle/debug/app-debug.aab release_artifacts/Alif_Water_Sort_Pro.aab
          echo "Build artifacts successfully prepared:"
          ls -lh release_artifacts/

      - name: Upload APK & AAB to GitHub Artifacts (Downloadable from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: Alif-Water-Sort-Pro-Binaries
          path: release_artifacts/*
          retention-days: 90
