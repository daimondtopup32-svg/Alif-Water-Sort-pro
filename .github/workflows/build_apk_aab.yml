name: Build APK and AAB for Google Play and Amazon

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Debug APK (For Amazon Appstore & Direct Android Installation)
        run: ./gradlew :app:assembleDebug

      - name: Build Android App Bundle AAB (For Google Play Store Console)
        run: ./gradlew :app:bundleDebug

      - name: Organize Outputs
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release_artifacts/Alif_Water_Sort_Pro.apk
          cp app/build/outputs/bundle/debug/app-debug.aab release_artifacts/Alif_Water_Sort_Pro.aab
          ls -lh release_artifacts/

      - name: Upload APK & AAB to GitHub Artifacts (Downloadable from Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: Alif-Water-Sort-Pro-Binaries
          path: release_artifacts/*
          retention-days: 90
